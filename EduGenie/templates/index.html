<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ app_name }} — AI Learning Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="hero">
    <div class="container">
      <p class="eyebrow">AI-POWERED LEARNING ASSISTANT</p>
      <h1>EduGenie</h1>
      <p class="subtitle">Ask, understand, practice, summarize, and plan your learning journey.</p>
    </div>
  </header>

  <main class="container main-grid">
    <section class="card">
      <div class="field">
        <label for="task">Learning task</label>
        <select id="task">
          <option value="qa">Ask a Question</option>
          <option value="explain">Explain a Topic</option>
          <option value="quiz">Generate Quiz</option>
          <option value="summarize">Summarize Text</option>
          <option value="learn">Recommend Learning Path</option>
        </select>
      </div>

      <div class="field">
        <label for="inputText">Your input</label>
        <textarea id="inputText" rows="10" placeholder="Example: Explain the Pythagoras theorem..."></textarea>
      </div>

      <div id="options" class="options"></div>

      <button id="submitBtn" class="primary-btn">Run EduGenie</button>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section class="card result-card">
      <div class="result-heading">
        <h2>Result</h2>
        <button id="copyBtn" class="secondary-btn" disabled>Copy</button>
      </div>
      <div id="result" class="result" aria-live="polite">
        <div class="empty-state">
          <span>✨</span>
          <p>Your AI-generated learning result will appear here.</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>EduGenie · FastAPI + Google Gemini · Model: {{ gemini_model }}</p>
    </div>
  </footer>

  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
